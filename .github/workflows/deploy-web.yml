name: 밑줄 웹 배포

# GitHub Pages로 껍데기만 올린다. 기록은 기기의 OPFS에 있고 서버로 가지 않으므로
# 사이트가 공개여도 일기가 공개되는 것은 아니다.
# 저장소 설정 → Pages → Source를 'GitHub Actions'로 한 번 바꿔 두어야 동작한다.

# PR에서도 빌드와 테스트를 돌린다. main 푸시에서만 도는 동안 타입 오류가 그대로 main까지 갔다 —
# 검증하지 않는 변경은 배포할 때가 아니라 합칠 때 막아야 한다. 올리는 일만 main에서 한다.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'mitjul/src/**'
      - 'mitjul/tests/**'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'mitjul/src/**'
      - 'mitjul/tests/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것을 끊지는 않는다.
# PR 검사는 브랜치마다 따로 줄을 서서 배포를 기다리지 않는다.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성
        working-directory: web
        run: npm ci
      - name: 타입 검사와 빌드
        working-directory: web
        run: npm run build
      - name: 코어 테스트 (네이티브와 공유하는 로직)
        working-directory: mitjul
        run: npm ci && npm test
      # 올리는 일은 PR이 아닐 때만. PR에서는 여기까지가 검사다.
      # 'push'로 못 박으면 수동 실행(workflow_dispatch)이 빌드만 하고 배포를 건너뛴다 —
      # 저장소 설정을 바꾼 뒤 곧바로 돌려 볼 길이 그것이므로 남겨 둔다.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
