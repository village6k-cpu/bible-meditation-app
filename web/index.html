<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover는 두 가지를 동시에 떠받친다: env(safe-area-inset-*)가 0이 아니게 되는 것과,
         Safari 26에서 theme-color가 아니라 html/body 배경색으로 상태 표시줄이 칠해지는 것. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>밑줄</title>
    <meta name="description" content="적기만 하는 기록 말고, 구조가 붙는 기록" />

    <!-- 홈 화면 웹앱 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" href="./icon-192.png" type="image/png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="밑줄" />
    <!-- Safari 26부터 이 값은 설치된 웹앱에서만 쓰인다. 탭에서는 body 배경색이 상태 표시줄을 칠한다. -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D10" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
